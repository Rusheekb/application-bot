# Builds the public job board: scans the shared job sources (feed/sources.json) on a schedule and
# publishes the board to GitHub Pages. Visitors' settings stay in their own browsers, so nothing
# here is personal and no secrets are needed. Setup: "Hosted job board" in the README.
name: Job board

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (GitHub may start scheduled runs a little late)
  workflow_dispatch:
  # Publish right away when the sources or the board page change.
  push:
    branches: [main]
    paths:
      - feed/**
      - src/jobbot/board/**
      - src/jobbot/publish.py

permissions:
  contents: read

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install jobbot
        run: pip install ".[scrapers]"
      # The job history is kept between runs in the Actions cache, so the board knows which jobs
      # are new and which have closed.
      - name: Restore the job history
        uses: actions/cache/restore@v4
        with:
          path: .jobbot-state
          key: jobbot-feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobbot-feed-
      - name: Scan and build the board
        run: jobbot publish --sources feed/sources.json --out site --state .jobbot-state/state.db.gz
        env:
          # Optional: more job sources for the shared feed. Never sent to visitors.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JOBBOT_DATA_DIR: ${{ runner.temp }}/jobbot
      - name: Save the job history
        if: hashFiles('.jobbot-state/state.db.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .jobbot-state
          key: jobbot-feed-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
