name: CI

on:
  push:
    paths-ignore:
      - .jobbot/** # settings saved from the hosted job board
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # an install step occasionally stalls; fail instead of waiting for hours
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,apply,pages]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q
