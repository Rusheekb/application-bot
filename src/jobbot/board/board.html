<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Job board · jobbot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💼</text></svg>">
<style>
:root {
  --bg: #f6f7f9; --surface: #fff; --surface-2: #f1f3f6; --border: #e2e5ea; --text: #1c2230; --muted: #5d6676;
  --faint: #8b93a1; --accent: #3b5bdb; --accent-soft: #e8edff; --accent-text: #2f4ac0; --on-accent: #fff;
  --good: #1f8a4c; --good-soft: #e3f4ea; --ok: #1c7c8c; --ok-soft: #e0f2f4; --warn: #a66300; --warn-soft: #fdf1dc;
  --bad: #c0392b; --bad-soft: #fbe7e4; --shadow: 0 1px 2px rgba(20,28,45,.06), 0 1px 3px rgba(20,28,45,.04);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --surface: #1a1e26; --surface-2: #222733; --border: #2d3340; --text: #e6e9ef; --muted: #a3abba;
    --faint: #7a8291; --accent: #7b93ff; --accent-soft: #252d4a; --accent-text: #a9b8ff; --on-accent: #0d1326;
    --good: #4cc27f; --good-soft: #1b3326; --ok: #4fb7c7; --ok-soft: #173238; --warn: #e0a547; --warn-soft: #3a2e17;
    --bad: #ef7466; --bad-soft: #3b1f1c; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 var(--font); color: var(--text); background: var(--bg); }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button, .btn {
  font: inherit; font-size: .88rem; font-weight: 500; display: inline-flex; align-items: center; justify-content: center;
  gap: .3rem; padding: .4rem .75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none;
}
button:hover, .btn:hover { background: var(--surface-2); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-sm { padding: .25rem .55rem; font-size: .8rem; }
input, select { font: inherit; font-size: .92rem; padding: .45rem .6rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
input:focus, select:focus, button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: .6rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 1.05rem; }
.brand span { color: var(--accent); }
.spacer { flex: 1; }
.updated { font-size: .85rem; color: var(--muted); }
main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
h1 { font-size: 1.45rem; margin: 0 0 .25rem; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.notice { border-radius: 10px; padding: .7rem 1rem; margin-bottom: 1rem; background: var(--warn-soft); }
.notice summary { cursor: pointer; }
.notice ul { margin: .4rem 0 0; padding-left: 1.2rem; font-size: .88rem; overflow-wrap: anywhere; }
.tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--border); margin: 1rem 0; overflow-x: auto; }
.tabs button { border: 0; border-radius: 0; background: none; color: var(--muted); padding: .5rem .8rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.active { color: var(--accent-text); border-bottom-color: var(--accent); }
.tabs .count { font-size: .76rem; color: var(--faint); margin-left: .25rem; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.filters input { flex: 1 1 220px; max-width: 320px; }
.list { display: flex; flex-direction: column; gap: .6rem; }
.job { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: .85rem 1rem; }
.job.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.job-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: .9rem; align-items: start; }
.score { width: 54px; height: 54px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; line-height: 1; background: var(--surface-2); color: var(--muted); }
.score small { font-size: .58rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; opacity: .8; }
.score.high { background: var(--good-soft); color: var(--good); }
.score.medium { background: var(--ok-soft); color: var(--ok); }
.score.low { background: var(--warn-soft); color: var(--warn); }
.score.poor { background: var(--bad-soft); color: var(--bad); }
.title { font-weight: 600; font-size: 1.02rem; color: var(--text); background: none; border: 0; padding: 0; text-align: left; white-space: normal; }
.title:hover { background: none; text-decoration: underline; }
.meta { color: var(--muted); font-size: .87rem; margin-top: .1rem; }
.summary { margin: .4rem 0 0; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .45rem; }
.chip { font-size: .74rem; font-weight: 500; padding: .1rem .5rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.chip.new { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(74px, auto)); gap: .35rem; }
.details { border-top: 1px solid var(--border); margin-top: .85rem; padding-top: .85rem; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 1.25rem; }
.details h3 { font-size: .92rem; margin: .6rem 0 .25rem; }
.details h3:first-child { margin-top: 0; }
.details ul { margin: 0; padding-left: 1.1rem; font-size: .9rem; }
.description { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .92rem; line-height: 1.6; max-height: 32rem; overflow: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; font-size: .86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.empty { text-align: center; padding: 3rem 1rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.kbd { font-size: .8rem; color: var(--faint); margin-top: 1rem; }
kbd { font-family: var(--mono); font-size: .74rem; padding: .05rem .35rem; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); }
.lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.25rem; }
.lock form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 1.6rem; display: flex; flex-direction: column; gap: .8rem; }
.lock h1 { font-size: 1.3rem; }
.lock label { font-size: .9rem; font-weight: 500; }
.lock .check { display: flex; gap: .5rem; align-items: center; font-weight: 400; color: var(--muted); }
.error { color: var(--bad); font-size: .88rem; min-height: 1.2em; }
.spinner { display: inline-block; width: .9em; height: .9em; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .job-row { grid-template-columns: 46px minmax(0, 1fr); }
  .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; }
  .details { grid-template-columns: 1fr; }
  .topbar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<script id="jobbot-envelope" type="application/json">__JOBBOT_ENVELOPE__</script>

<div class="lock" id="lock">
  <form id="unlock-form" autocomplete="off">
    <div class="brand">job<span>bot</span></div>
    <h1>Your job board</h1>
    <p class="muted" style="margin:0">This page is encrypted. Enter the passphrase you saved as <code>JOBBOT_PAGE_PASSWORD</code>.</p>
    <label for="passphrase">Passphrase</label>
    <input id="passphrase" type="password" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> Remember on this device</label>
    <div class="error" id="unlock-error" role="alert"></div>
    <button class="btn-primary" type="submit" id="unlock-button">Unlock</button>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">job<span>bot</span></div>
    <span class="spacer"></span>
    <span class="updated" id="updated"></span>
    <button class="btn-sm" id="lock-button" title="Forget the key on this device and lock">Lock</button>
  </header>
  <main>
    <div id="errors"></div>
    <h1>Jobs</h1>
    <p class="muted" id="subtitle" style="margin:0"></p>
    <nav class="tabs" id="tabs" aria-label="Job status"></nav>
    <div class="filters">
      <input type="search" id="search" placeholder="Search title, company, location" aria-label="Search">
      <select id="min-score" aria-label="Minimum score">
        <option value="0">Any score</option><option value="40">40+</option><option value="60">60+</option>
        <option value="70">70+</option><option value="80">80+</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="best">Best match</option><option value="newest">Newest posting</option><option value="found">Recently found</option>
      </select>
    </div>
    <div class="list" id="list"></div>
    <p class="kbd">Keyboard: <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>Enter</kbd> details · <kbd>s</kbd> save · <kbd>a</kbd> applied · <kbd>d</kbd> dismiss · <kbd>o</kbd> open posting. Your choices are saved in this browser only.</p>
  </main>
</div>

<script>
(() => {
  "use strict";
  const envelope = JSON.parse(document.getElementById("jobbot-envelope").textContent);
  const SITE = location.pathname.replace(/[^a-z0-9]+/gi, "-");
  const KEY_STORE = `jobbot:key:${SITE}`;
  const STATUS_STORE = `jobbot:status:${SITE}`;
  const SEEN_STORE = `jobbot:seen:${SITE}`;
  const LIKELIHOOD = { high: "High chance", medium: "Decent chance", low: "Long shot", very_low: "Very unlikely" };
  const SENIORITY = { under: "role is above your level", match: "good match", over: "you may be overqualified", unclear: "unclear" };
  const TABS = [["review", "To review"], ["saved", "Saved"], ["applied", "Applied"], ["dismissed", "Dismissed"], ["hidden", "Hidden by filters"], ["all", "All"]];

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ } },
    remove(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
  };

  async function deriveKey(passphrase) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(envelope.salt), iterations: envelope.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function decryptWith(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(envelope.iv) }, key, b64(envelope.data));
    if (envelope.compression !== "gzip") return JSON.parse(new TextDecoder().decode(plain));
    const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }

  // --- unlock -------------------------------------------------------------------------------
  const form = document.getElementById("unlock-form");
  const errorEl = document.getElementById("unlock-error");
  const button = document.getElementById("unlock-button");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { errorEl.textContent = "This browser can't open the board. Use an up-to-date browser over HTTPS."; return; }
    errorEl.textContent = "";
    button.disabled = true;
    button.textContent = "Unlocking…";
    let key, payload;
    try {
      key = await deriveKey(document.getElementById("passphrase").value);
      payload = await decryptWith(key);
    } catch (err) {
      errorEl.textContent = "That passphrase didn't work.";
    }
    try {
      if (payload) {
        if (document.getElementById("remember").checked) {
          const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
          store.set(KEY_STORE, btoa(String.fromCharCode(...raw)));
        }
        start(payload);
      }
    } catch (err) {
      errorEl.textContent = `Unlocked, but the board couldn't be shown: ${err.message || err}`;
    } finally {
      button.disabled = false;
      button.textContent = "Unlock";
    }
  });
  document.getElementById("lock-button").addEventListener("click", () => { store.remove(KEY_STORE); location.reload(); });

  (async () => {
    const saved = store.get(KEY_STORE, null);
    if (!saved || !window.crypto || !crypto.subtle || !window.DecompressionStream) return;
    let payload;
    try {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      payload = await decryptWith(key);
    } catch (err) {
      store.remove(KEY_STORE);  // the passphrase changed since it was remembered
      return;
    }
    start(payload);
  })();

  // --- helpers ------------------------------------------------------------------------------
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false || child === "") continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
  function ago(iso) {
    if (!iso) return "";
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    const d = Math.round(s / 86400);
    return d < 60 ? `${d}d ago` : `${Math.round(d / 30)}mo ago`;
  }
  const time = (iso) => (iso ? Date.parse(iso) || 0 : 0);
  const band = (score) => (score == null ? "" : score >= 80 ? "high" : score >= 60 ? "medium" : score >= 40 ? "low" : "poor");

  // --- app ----------------------------------------------------------------------------------
  let data = null, tab = "review", selected = -1, expanded = new Set();
  let statuses = store.get(STATUS_STORE, {});
  let seenBefore = new Set(store.get(SEEN_STORE, []));
  const firstVisit = seenBefore.size === 0;

  function start(payload) {
    data = payload;
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    const scan = data.scan || {};
    const updated = document.getElementById("updated");
    updated.textContent = `Updated ${ago(data.generated)}`;
    updated.title = new Date(data.generated).toLocaleString();
    renderErrors(scan.errors || []);
    for (const id of ["search", "min-score", "sort"]) document.getElementById(id).addEventListener("input", render);
    render();
    store.set(SEEN_STORE, [...new Set([...seenBefore, ...data.jobs.map((j) => j.id)])].slice(-5000));
  }

  function renderErrors(errors) {
    const box = document.getElementById("errors");
    box.replaceChildren();
    if (!errors.length) return;
    box.append(el("details", { class: "notice" },
      el("summary", {}, `${errors.length} problem${errors.length === 1 ? "" : "s"} in the last scan`),
      el("ul", {}, errors.map((e) => el("li", {}, el("strong", {}, e.source), `: ${e.error}`)))));
  }

  const statusOf = (job) => statuses[job.id] || "review";
  function setStatus(job, status) {
    if (status === "review") delete statuses[job.id]; else statuses[job.id] = status;
    store.set(STATUS_STORE, statuses);
    render();
  }

  function visibleJobs() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const min = Number(document.getElementById("min-score").value);
    const sort = document.getElementById("sort").value;
    let jobs = tab === "all" ? data.jobs : data.jobs.filter((j) => statusOf(j) === tab);
    if (q) jobs = jobs.filter((j) => `${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q));
    if (min) jobs = jobs.filter((j) => (j.score || 0) >= min);
    const by = {
      best: (a, b) => (b.score ?? -1) - (a.score ?? -1) || time(b.posted) - time(a.posted),
      newest: (a, b) => time(b.posted || b.found) - time(a.posted || a.found),
      found: (a, b) => time(b.found) - time(a.found),
    }[sort];
    return [...jobs].sort(by);
  }

  function renderTabs() {
    const counts = { review: 0, saved: 0, applied: 0, dismissed: 0, hidden: data.hidden.length, all: data.jobs.length };
    for (const j of data.jobs) counts[statusOf(j)] = (counts[statusOf(j)] || 0) + 1;
    document.getElementById("tabs").replaceChildren(...TABS.map(([key, label]) =>
      el("button", { class: key === tab ? "active" : "", onclick: () => { tab = key; selected = -1; render(); } },
        label, el("span", { class: "count" }, counts[key] || 0))));
  }

  function card(job, index) {
    const status = statusOf(job);
    const isNew = !firstVisit && !seenBefore.has(job.id);
    const metaParts = [job.location, job.workplace && !job.location.toLowerCase().includes(job.workplace) ? job.workplace[0].toUpperCase() + job.workplace.slice(1) : "", job.salary, job.posted ? `posted ${ago(job.posted)}` : `found ${ago(job.found)}`].filter(Boolean);
    const summary = job.summary
      ? el("p", { class: "summary" }, job.likelihood ? el("strong", {}, `${LIKELIHOOD[job.likelihood] || ""}. `) : null, job.summary)
      : el("p", { class: "summary muted" },
          job.skills.length ? `Mentions ${job.skills.slice(0, 6).join(", ")}${job.skills.length > 6 ? ` and ${job.skills.length - 6} more` : ""}. ` : "",
          job.notes.join(". "));
    const act = (label, value, cls) => el("button", { class: `btn-sm ${cls || ""}`, "data-action": value, onclick: () => setStatus(job, value) }, label);
    const open = safeUrl(job.apply || job.url);
    const actions = el("div", { class: "actions" },
      open ? el("a", { class: "btn btn-sm", "data-action": "open", href: open, target: "_blank", rel: "noopener noreferrer" }, "Open ↗") : null,
      status !== "saved" ? act("Save", "saved") : act("Unsave", "review"),
      status !== "applied" ? act("Applied", "applied") : act("Not applied", "review"),
      status !== "dismissed" ? act("Dismiss", "dismissed", "btn-ghost") : act("Restore", "review", "btn-ghost"));
    const node = el("article", { class: `job${index === selected ? " selected" : ""}`, "data-index": index },
      el("div", { class: "job-row" },
        el("div", { class: `score ${band(job.score)}`, title: job.ai ? "AI fit score" : "Estimated fit" },
          job.score ?? "–", el("small", {}, job.ai ? "AI" : "est.")),
        el("div", {},
          el("button", { class: "title", "aria-expanded": expanded.has(job.id) ? "true" : "false", onclick: () => toggle(job) }, job.title),
          el("div", { class: "meta" }, el("strong", {}, job.company), metaParts.map((p) => ` · ${p}`)),
          summary,
          el("div", { class: "chips" },
            isNew ? el("span", { class: "chip new" }, "New") : null,
            job.sources.map((s) => el("span", { class: "chip" }, s)),
            job.years ? el("span", { class: "chip" }, `${job.years}+ yrs`) : null,
            status !== "review" && tab === "all" ? el("span", { class: "chip" }, status) : null)),
        actions));
    if (expanded.has(job.id)) node.append(details(job));
    return node;
  }

  function details(job) {
    const list = (title, items) => (items && items.length ? [el("h3", {}, title), el("ul", {}, items.map((x) => el("li", {}, x)))] : []);
    const bd = job.breakdown || {};
    const side = el("div", {},
      job.ai
        ? [el("h3", {}, "Your chances"), el("p", { style: "margin:0;font-size:.9rem" }, `${LIKELIHOOD[job.likelihood] || ""}${job.seniority ? ` · seniority: ${SENIORITY[job.seniority] || job.seniority}` : ""}`),
           ...list("Dealbreakers", job.dealbreakers), ...list("Why you fit", job.strengths), ...list("Gaps", job.gaps), ...list("To stand out", job.tips)]
        : [el("h3", {}, "Estimated fit"), el("p", { class: "muted", style: "margin:0;font-size:.88rem" }, "From title, skills, experience, freshness and workplace. Add an Anthropic API key secret for an AI analysis.")],
      el("h3", {}, "Score breakdown"),
      el("dl", { class: "kv" },
        el("dt", {}, "Title"), el("dd", {}, `${bd.title ?? "–"}/30`),
        el("dt", {}, "Skills"), el("dd", {}, `${bd.skills ?? "–"}/35`),
        el("dt", {}, "Experience"), el("dd", {}, `${bd.experience ?? "–"}/20`),
        el("dt", {}, "Freshness"), el("dd", {}, `${bd.freshness ?? "–"}/10`),
        el("dt", {}, "Workplace"), el("dd", {}, `${bd.workplace ?? "–"}/5`)),
      job.url && job.apply && job.url !== job.apply ? el("p", { style: "font-size:.88rem" }, el("a", { href: safeUrl(job.url), target: "_blank", rel: "noopener noreferrer" }, "View the original posting ↗")) : null);
    return el("div", { class: "details" },
      el("div", {}, el("h3", {}, "Job description"), el("div", { class: "description" }, job.description || "No description available; open the posting to read it.")),
      side);
  }

  function toggle(job) {
    if (expanded.has(job.id)) expanded.delete(job.id); else expanded.add(job.id);
    render();
  }

  function hiddenRow(job) {
    const open = safeUrl(job.url);
    return el("article", { class: "job" },
      el("div", {}, open ? el("a", { class: "title", href: open, target: "_blank", rel: "noopener noreferrer" }, job.title) : el("strong", {}, job.title),
        el("div", { class: "meta" }, el("strong", {}, job.company), job.location ? ` · ${job.location}` : ""),
        el("div", { class: "chips" }, el("span", { class: "chip warn" }, `Hidden: ${job.reason}`))));
  }

  function render() {
    renderTabs();
    const list = document.getElementById("list");
    const subtitle = document.getElementById("subtitle");
    if (tab === "hidden") {
      subtitle.textContent = "Jobs your filters hid, with the reason. Change filters in your config.";
      list.replaceChildren(...(data.hidden.length ? data.hidden.map(hiddenRow) : [el("div", { class: "empty" }, "Nothing hidden.")]));
      return;
    }
    const jobs = visibleJobs();
    subtitle.textContent = `${jobs.length} job${jobs.length === 1 ? "" : "s"}. Best matches first.`;
    if (selected >= jobs.length) selected = jobs.length - 1;
    list.replaceChildren(...(jobs.length ? jobs.map(card) : [el("div", { class: "empty" }, tab === "review" ? "You're all caught up. New matches appear after the next scan." : "Nothing here.")]));
    list._jobs = jobs;
  }

  document.addEventListener("keydown", (e) => {
    if (!data || e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, select, textarea")) return;
    if (e.key === "Enter" && e.target.closest("button, a")) return;  // let the focused control handle it
    const jobs = document.getElementById("list")._jobs || [];
    if (!jobs.length) return;
    const move = (i) => { selected = Math.max(0, Math.min(i, jobs.length - 1)); render(); const n = document.querySelector(".job.selected"); if (n) n.scrollIntoView({ block: "nearest" }); };
    if (e.key === "j") { move(selected + 1); e.preventDefault(); return; }
    if (e.key === "k") { move(selected - 1); e.preventDefault(); return; }
    const job = jobs[selected];
    if (!job) return;
    if (e.key === "Enter") { toggle(job); e.preventDefault(); }
    else if (e.key === "s") setStatus(job, statusOf(job) === "saved" ? "review" : "saved");
    else if (e.key === "a") setStatus(job, statusOf(job) === "applied" ? "review" : "applied");
    else if (e.key === "d") setStatus(job, statusOf(job) === "dismissed" ? "review" : "dismissed");
    else if (e.key === "o") { const u = safeUrl(job.apply || job.url); if (u) window.open(u, "_blank", "noopener"); }
  });
})();
</script>
</body>
</html>
