<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<title>Job board · jobbot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💼</text></svg>">
<style>
:root {
  --bg: #f6f7f9; --surface: #fff; --surface-2: #f1f3f6; --border: #e2e5ea; --text: #1c2230; --muted: #5d6676;
  --faint: #8b93a1; --accent: #3b5bdb; --accent-soft: #e8edff; --accent-text: #2f4ac0; --on-accent: #fff;
  --good: #1f8a4c; --good-soft: #e3f4ea; --ok: #1c7c8c; --ok-soft: #e0f2f4; --warn: #a66300; --warn-soft: #fdf1dc;
  --bad: #c0392b; --bad-soft: #fbe7e4; --shadow: 0 1px 2px rgba(20,28,45,.06), 0 1px 3px rgba(20,28,45,.04);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --surface: #1a1e26; --surface-2: #222733; --border: #2d3340; --text: #e6e9ef; --muted: #a3abba;
    --faint: #7a8291; --accent: #7b93ff; --accent-soft: #252d4a; --accent-text: #a9b8ff; --on-accent: #0d1326;
    --good: #4cc27f; --good-soft: #1b3326; --ok: #4fb7c7; --ok-soft: #173238; --warn: #e0a547; --warn-soft: #3a2e17;
    --bad: #ef7466; --bad-soft: #3b1f1c; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 var(--font); color: var(--text); background: var(--bg); }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button, .btn {
  font: inherit; font-size: .88rem; font-weight: 500; display: inline-flex; align-items: center; justify-content: center;
  gap: .3rem; padding: .4rem .75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none;
}
button:hover, .btn:hover { background: var(--surface-2); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-sm { padding: .25rem .55rem; font-size: .8rem; }
input, select, textarea { font: inherit; font-size: .92rem; padding: .45rem .6rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
input:focus, select:focus, textarea:focus, button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=checkbox] { padding: 0; width: 1rem; height: 1rem; accent-color: var(--accent); }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: .6rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 1.05rem; }
.brand span { color: var(--accent); }
.spacer { flex: 1; }
.updated { font-size: .85rem; color: var(--muted); }
main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
h1 { font-size: 1.45rem; margin: 0 0 .25rem; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.notice { border-radius: 10px; padding: .7rem 1rem; margin-bottom: 1rem; background: var(--warn-soft); }
.notice summary { cursor: pointer; }
.notice ul { margin: .4rem 0 0; padding-left: 1.2rem; font-size: .88rem; overflow-wrap: anywhere; }
.tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--border); margin: 1rem 0; overflow-x: auto; }
.tabs button { border: 0; border-radius: 0; background: none; color: var(--muted); padding: .5rem .8rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.active { color: var(--accent-text); border-bottom-color: var(--accent); }
.tabs .count { font-size: .76rem; color: var(--faint); margin-left: .25rem; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.filters input { flex: 1 1 220px; max-width: 320px; }
.list { display: flex; flex-direction: column; gap: .6rem; }
.job { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: .85rem 1rem; }
.job.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.job-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: .9rem; align-items: start; }
.score { width: 54px; height: 54px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; line-height: 1; background: var(--surface-2); color: var(--muted); }
.score small { font-size: .58rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; opacity: .8; }
.score.high { background: var(--good-soft); color: var(--good); }
.score.medium { background: var(--ok-soft); color: var(--ok); }
.score.low { background: var(--warn-soft); color: var(--warn); }
.score.poor { background: var(--bad-soft); color: var(--bad); }
.title { font-weight: 600; font-size: 1.02rem; color: var(--text); background: none; border: 0; padding: 0; text-align: left; white-space: normal; }
.title:hover { background: none; text-decoration: underline; }
.meta { color: var(--muted); font-size: .87rem; margin-top: .1rem; }
.summary { margin: .4rem 0 0; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .45rem; }
.chip { font-size: .74rem; font-weight: 500; padding: .1rem .5rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.chip.new { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(74px, auto)); gap: .35rem; }
.details { border-top: 1px solid var(--border); margin-top: .85rem; padding-top: .85rem; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 1.25rem; }
.details h3 { font-size: .92rem; margin: .6rem 0 .25rem; }
.details h3:first-child { margin-top: 0; }
.details ul { margin: 0; padding-left: 1.1rem; font-size: .9rem; }
.description { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .92rem; line-height: 1.6; max-height: 32rem; overflow: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; font-size: .86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.empty { text-align: center; padding: 3rem 1rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.kbd { font-size: .8rem; color: var(--faint); margin-top: 1rem; }
kbd { font-family: var(--mono); font-size: .74rem; padding: .05rem .35rem; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); }
.lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.25rem; }
.lock form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 1.6rem; display: flex; flex-direction: column; gap: .8rem; }
.lock h1 { font-size: 1.3rem; }
.lock label { font-size: .9rem; font-weight: 500; }
.lock .check { display: flex; gap: .5rem; align-items: center; font-weight: 400; color: var(--muted); }
.error { color: var(--bad); font-size: .88rem; min-height: 1.2em; }
.spinner { display: inline-block; width: .9em; height: .9em; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.notice.info { background: var(--accent-soft); }
.settings { max-width: 780px; }
.settings-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.settings fieldset { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); padding: .9rem 1.1rem 1rem; margin: 0 0 1rem; min-width: 0; }
.settings legend { float: left; width: 100%; padding: 0; margin-bottom: .3rem; font-weight: 650; }
.settings legend + * { clear: both; }
.field { display: flex; flex-direction: column; gap: .25rem; margin: .7rem 0 0; }
.field > label, .field > .label { font-size: .88rem; font-weight: 500; }
.field input:not([type=checkbox]), .field textarea, .rows input:not([type=checkbox]), .settings textarea { width: 100%; }
.settings textarea { resize: vertical; line-height: 1.45; }
.hint { font-size: .83rem; color: var(--muted); margin: .25rem 0 0; }
ol.hint { padding-left: 1.2rem; }
.check { display: flex; gap: .5rem; align-items: center; font-size: .9rem; }
label.check.field { flex-direction: row; font-weight: 400; }
.choices, .sites { display: flex; flex-wrap: wrap; gap: .3rem 1rem; }
.rows { display: flex; flex-direction: column; gap: .5rem; margin: .7rem 0; }
.row.company { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: .4rem; }
.row.search { border: 1px solid var(--border); border-radius: 8px; padding: .6rem; background: var(--surface-2); }
.row-main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto auto; gap: .4rem; align-items: center; }
.sites { margin-top: .5rem; }
.sites .check { font-size: .84rem; }
.btn-row, .inline { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
.inline input { flex: 1 1 200px; }
.mono { font-family: var(--mono); font-size: .8rem !important; }
.link { border: 0; background: none; padding: 0; color: var(--accent-text); font-size: inherit; font-weight: inherit; }
.link:hover { background: none; text-decoration: underline; }
.save-bar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .75rem 0; background: var(--bg); border-top: 1px solid var(--border); }
.msg { font-size: .9rem; flex: 1 1 260px; }
.msg.good { color: var(--good); }
.msg.bad { color: var(--bad); }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .job-row { grid-template-columns: 46px minmax(0, 1fr); }
  .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; }
  .details { grid-template-columns: 1fr; }
  .topbar { flex-wrap: wrap; }
  .row.company, .row-main { grid-template-columns: minmax(0, 1fr) auto; }
  .row.company { border: 1px solid var(--border); border-radius: 8px; padding: .5rem; background: var(--surface-2); }
  .row.company input[type=url] { grid-column: 1 / -1; grid-row: 2; }
  .row-main input:not([type=checkbox]) { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<script id="jobbot-envelope" type="application/json">__JOBBOT_ENVELOPE__</script>

<div class="lock" id="lock">
  <form id="unlock-form" autocomplete="off">
    <div class="brand">job<span>bot</span></div>
    <h1>Your job board</h1>
    <p class="muted" style="margin:0">This page is encrypted. Enter the passphrase you saved as <code>JOBBOT_PAGE_PASSWORD</code>.</p>
    <label for="passphrase">Passphrase</label>
    <input id="passphrase" type="password" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> Remember on this device</label>
    <div class="error" id="unlock-error" role="alert"></div>
    <button class="btn-primary" type="submit" id="unlock-button">Unlock</button>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">job<span>bot</span></div>
    <span class="spacer"></span>
    <span class="updated" id="updated"></span>
    <button class="btn-sm" id="settings-button" aria-pressed="false" hidden>Settings</button>
    <button class="btn-sm" id="lock-button" title="Forget the key on this device and lock">Lock</button>
  </header>
  <main>
    <div id="banner"></div>
    <div id="errors"></div>
    <section id="jobs-view">
      <h1>Jobs</h1>
      <p class="muted" id="subtitle" style="margin:0"></p>
      <nav class="tabs" id="tabs" aria-label="Job status"></nav>
      <div class="filters">
        <input type="search" id="search" placeholder="Search title, company, location" aria-label="Search">
        <select id="min-score" aria-label="Minimum score">
          <option value="0">Any score</option><option value="40">40+</option><option value="60">60+</option>
          <option value="70">70+</option><option value="80">80+</option>
        </select>
        <select id="sort" aria-label="Sort">
          <option value="best">Best match</option><option value="newest">Newest posting</option><option value="found">Recently found</option>
        </select>
      </div>
      <div class="list" id="list"></div>
      <p class="kbd">Keyboard: <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>Enter</kbd> details · <kbd>s</kbd> save · <kbd>a</kbd> applied · <kbd>d</kbd> dismiss · <kbd>o</kbd> open posting. Your choices are saved in this browser only.</p>
    </section>
    <section id="settings-view" class="settings" hidden></section>
  </main>
</div>

<script>
(() => {
  "use strict";
  const envelope = JSON.parse(document.getElementById("jobbot-envelope").textContent);
  const SITE = location.pathname.replace(/[^a-z0-9]+/gi, "-");
  const KEY_STORE = `jobbot:key:${SITE}`;
  const STATUS_STORE = `jobbot:status:${SITE}`;
  const SEEN_STORE = `jobbot:seen:${SITE}`;
  const TOKEN_STORE = `jobbot:token:${SITE}`;
  const PENDING_STORE = `jobbot:pending:${SITE}`;
  const HOUR = 3600 * 1000;
  const LIKELIHOOD = { high: "High chance", medium: "Decent chance", low: "Long shot", very_low: "Very unlikely" };
  const SENIORITY = { under: "role is above your level", match: "good match", over: "you may be overqualified", unclear: "unclear" };
  const TABS = [["review", "To review"], ["saved", "Saved"], ["applied", "Applied"], ["dismissed", "Dismissed"], ["hidden", "Hidden by filters"], ["all", "All"]];

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  function toB64(bytes) {
    let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ } },
    remove(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
  };

  // --- encryption: the format `jobbot publish` writes (AES-256-GCM, key from PBKDF2-SHA256) ---
  async function deriveKey(passphrase, salt = envelope.salt, iterations = envelope.iterations) {
    if (!(iterations >= 100000 && iterations <= 10000000)) throw new Error("unexpected key settings");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(salt), iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  }
  async function gunzip(bytes) {
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  async function unseal(sealed, key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sealed.iv) }, key, b64(sealed.data));
    return JSON.parse(sealed.compression === "gzip" ? await gunzip(plain) : new TextDecoder().decode(plain));
  }
  async function seal(value, key) {
    const packed = await new Response(new Blob([JSON.stringify(value)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, packed));
    return { v: 1, kdf: envelope.kdf, iterations: envelope.iterations, salt: envelope.salt, compression: "gzip", iv: toB64(iv), data: toB64(data) };
  }

  // --- unlock -------------------------------------------------------------------------------
  const form = document.getElementById("unlock-form");
  const errorEl = document.getElementById("unlock-error");
  const button = document.getElementById("unlock-button");
  const supported = () => window.crypto && crypto.subtle && window.DecompressionStream;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!supported()) { errorEl.textContent = "This browser can't open the board. Use an up-to-date browser over HTTPS."; return; }
    errorEl.textContent = "";
    button.disabled = true;
    button.textContent = "Unlocking…";
    let key, payload;
    try {
      key = await deriveKey(document.getElementById("passphrase").value);
      payload = await unseal(envelope, key);
    } catch (err) {
      errorEl.textContent = "That passphrase didn't work.";
    }
    try {
      if (payload) {
        if (document.getElementById("remember").checked) {
          const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
          store.set(KEY_STORE, toB64(raw));
        }
        await start(payload, key);
      }
    } catch (err) {
      errorEl.textContent = `Unlocked, but the board couldn't be shown: ${err.message || err}`;
    } finally {
      button.disabled = false;
      button.textContent = "Unlock";
    }
  });
  document.getElementById("lock-button").addEventListener("click", () => { store.remove(KEY_STORE); location.reload(); });

  (async () => {
    const saved = store.get(KEY_STORE, null);
    if (!saved || !supported()) return;
    let key, payload;
    try {
      key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["encrypt", "decrypt"]);
      payload = await unseal(envelope, key);
    } catch (err) {
      store.remove(KEY_STORE);  // the passphrase changed since it was remembered
      return;
    }
    start(payload, key).catch((err) => { errorEl.textContent = `The board couldn't be shown: ${err.message || err}`; });
  })();

  // --- helpers ------------------------------------------------------------------------------
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false || child === "") continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
  const external = (href, text) => el("a", { href, target: "_blank", rel: "noopener noreferrer" }, text);
  function ago(iso) {
    if (!iso) return "";
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    const d = Math.round(s / 86400);
    return d < 60 ? `${d}d ago` : `${Math.round(d / 30)}mo ago`;
  }
  const time = (iso) => (iso ? Date.parse(iso) || 0 : 0);
  const band = (score) => (score == null ? "" : score >= 80 ? "high" : score >= 60 ? "medium" : score >= 40 ? "low" : "poor");

  // --- app ----------------------------------------------------------------------------------
  let data = null, boardKey = null, view = "jobs", tab = "review", selected = -1, expanded = new Set();
  let statuses = store.get(STATUS_STORE, {});
  let seenBefore = new Set(store.get(SEEN_STORE, []));
  const firstVisit = seenBefore.size === 0;
  // Settings: `meta` is what the scan sent (your settings, their defaults, where to save them).
  let meta = null;
  let current = {};        // the settings Settings opens with
  let knownSha = null;     // the version of the saved settings file this page knows about
  let savedAt = null;      // when settings were last saved here, until the board catches up
  let githubToken = null, tokenSaved = false;

  async function start(payload, key) {
    data = payload;
    boardKey = key;
    meta = data.settings || null;  // boards published before Settings existed don't have it
    if (meta) {
      current = meta.config || {};
      knownSha = meta.sha || null;
      // After a save, the board shows the old settings until the scan it started finishes.
      const pending = store.get(PENDING_STORE, null);
      if (pending && pending.sha !== meta.sha && time(data.generated) < pending.savedAt + HOUR) {
        try {
          current = await unseal(pending.config, key);
          knownSha = pending.sha;
          savedAt = pending.savedAt;
        } catch (err) { store.remove(PENDING_STORE); }
      } else store.remove(PENDING_STORE);
      const token = store.get(TOKEN_STORE, null);
      if (token) {
        try { githubToken = (await unseal(token, key)).token; tokenSaved = true; } catch (err) { store.remove(TOKEN_STORE); }
      }
    }
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    const scan = data.scan || {};
    const updated = document.getElementById("updated");
    updated.textContent = `Updated ${ago(data.generated)}`;
    updated.title = new Date(data.generated).toLocaleString();
    renderErrors(scan.errors || []);
    renderBanner();
    for (const id of ["search", "min-score", "sort"]) document.getElementById(id).addEventListener("input", render);
    settingsButton.hidden = !meta;
    if (meta && meta.needs_setup && !savedAt) showSettings(); else showJobs();
    store.set(SEEN_STORE, [...new Set([...seenBefore, ...data.jobs.map((j) => j.id)])].slice(-5000));
  }

  function renderErrors(errors) {
    const box = document.getElementById("errors");
    box.replaceChildren();
    if (!errors.length) return;
    box.append(el("details", { class: "notice" },
      el("summary", {}, `${errors.length} problem${errors.length === 1 ? "" : "s"} in the last scan`),
      el("ul", {}, errors.map((e) => el("li", {}, el("strong", {}, e.source), `: ${e.error}`)))));

      section("Filters", "Jobs a filter hides are listed under Hidden by filters, with the reason.", simple(FILTERS)),
      section("Eligibility", null, simple(ELIGIBILITY)),
      section("Notifications", "Get new high-scoring jobs sent to Discord, Slack, ntfy.sh or any webhook after each scan.", simple(NOTIFY)),
      section("Resume", null, simple(RESUME)),
      section("Back up or import", "Copy your settings as JSON to keep a backup, or paste settings from the jobbot app or the example config.", jsonTools()),
      section("Saving", null, savingHelp(), tokenBox),
      el("div", { class: "save-bar" }, saveButton, msgEl),
    ].filter(Boolean));
    renderToken();
    if (message) say(message, "good");
  }

  function intro() {
    const parts = [el("p", { class: "muted" }, "What your board looks for. Saving stores these settings in your GitHub repository, encrypted with your passphrase, and starts a new scan.")];
    if (meta.needs_setup && !savedAt) {
      parts.unshift(el("div", { class: "notice info", id: "welcome" }, el("strong", {}, "Welcome! "),
        "Tell your board what to look for: the roles you want, where, and which companies and job sites to check. Saving runs your first scan, which takes a few minutes."));
    }
    if (meta.origin === "secret") parts.push(el("p", { class: "hint" }, "These settings come from your JOBBOT_CONFIG secret. Once you save them here, your board uses the saved settings instead, and you can delete the secret."));
    if (meta.origin === "state") parts.push(el("p", { class: "hint" }, "These are the settings your last scan used. Save them to keep them."));
    return parts;
  }

  // If the passphrase changed, the saved settings can still be opened with the old one.
  function recovery() {
    if (!meta.unreadable || recovered || !meta.repository) return null;
    const pass = el("input", { type: "password", autocomplete: "off", placeholder: "Old passphrase", "aria-label": "Old passphrase" });
    const status = el("div", { class: "error", role: "alert" });
    const go = el("button", { type: "button", onclick: async () => {
      go.disabled = true;
      status.textContent = "";
      try {
        const res = await github(contentsUrl(), githubToken);
        if (!res.ok) throw new Error(problem(res));
        const sealed = JSON.parse(atob(res.json.content.replace(/\s+/g, "")));
        let doc;
        try {
          doc = await unseal(sealed, await deriveKey(pass.value, sealed.salt, sealed.iterations));
        } catch (err) {
          status.textContent = "That passphrase didn't work either.";
          return;
        }
        knownSha = res.json.sha;
        recovered = true;
        buildSettings(doc, "Recovered your saved settings. Press Save and scan to keep them with your current passphrase.");
      } catch (err) {
        status.textContent = `Couldn't load them: ${err.message || err}`;
      } finally {
        go.disabled = false;
      }
    } }, "Recover");
    return el("div", { class: "notice", id: "recovery" }, el("strong", {}, "Your saved settings couldn't be decrypted. "),
      "If you changed your passphrase, enter the old one to load them, then save them again.", el("div", { class: "inline" }, pass, go), status);
  }

  async function parseConfig(text) {
    text = text.trim();
    if (!text) throw new Error("paste your settings first");
    const doc = JSON.parse(text.startsWith("jobbot1:") ? await gunzip(b64(text.slice(8).replace(/\s+/g, ""))) : text);
    if (!doc || typeof doc !== "object" || Array.isArray(doc)) throw new Error("settings must be a JSON object");
    for (const key of Object.keys(doc)) if (key.startsWith("_")) delete doc[key];  // like "_help" in the example
    return doc;
  }

  function jsonTools() {
    const box = el("textarea", { rows: 6, class: "mono", id: "settings-json", spellcheck: "false", "aria-label": "Settings as JSON",
      placeholder: "Paste settings as JSON, or the jobbot1:… text from the jobbot app, then press Load into the form." });
    return [box, el("div", { class: "btn-row" },
      el("button", { type: "button", onclick: () => {
        try { box.value = JSON.stringify(collect(), null, 2); box.select(); } catch (err) { say(err.message, "bad"); }
      } }, "Show these settings as JSON"),
      el("button", { type: "button", onclick: async () => {
        try {
          const doc = await parseConfig(box.value);
          recovered = true;
          buildSettings(doc, "Loaded. Check the settings, then press Save and scan.");
        } catch (err) {
          say(`Couldn't load that: ${err.message || err}`, "bad");
        }
      } }, "Load into the form"))];
  }

  function savingHelp() {
    const repo = meta.repository;
    if (!repo) return el("p", { class: "hint" }, "Saving only works on your hosted board, which knows its GitHub repository.");
    return [
      el("p", { class: "hint" }, "Your settings are saved to ", el("code", {}, meta.path), " in ", external(`https://github.com/${repo}`, repo),
        ", encrypted with your passphrase. GitHub Pages can't save anything by itself, so this page needs a GitHub token that can write to that repository:"),
      el("ol", { class: "hint" },
        el("li", {}, external("https://github.com/settings/personal-access-tokens/new", "Create a fine-grained token ↗"), ". Any name works; choose when it expires."),
        el("li", {}, "Under Repository access, choose ", el("strong", {}, "Only select repositories"), " and pick ", el("strong", {}, repo.split("/").pop()), "."),
        el("li", {}, "Under Permissions, set ", el("strong", {}, "Contents"), " to ", el("strong", {}, "Read and write"), ". Nothing else is needed."),
        el("li", {}, "Generate the token and paste it below.")),
    ];
  }

  function renderToken() {
    if (!meta.repository) return;
    tokenInput = el("input", { type: "password", id: "github-token", autocomplete: "off", spellcheck: "false",
      placeholder: githubToken ? "Paste a new token to replace the one you're using" : "github_pat_…" });
    rememberInput = el("input", { type: "checkbox", id: "remember-token", checked: true });
    const status = githubToken
      ? el("p", { class: "hint", id: "token-status" }, tokenSaved ? "A token is saved on this device. " : "Using the token you pasted, until you leave this page. ",
          el("button", { type: "button", class: "link", onclick: forgetToken }, "Forget it"))
      : null;
    tokenBox.replaceChildren(
      el("div", { class: "field" }, el("label", { for: "github-token" }, "GitHub token"), tokenInput, status),
      el("label", { class: "check field" }, rememberInput, "Remember it on this device (encrypted with your passphrase; it's only ever sent to api.github.com)"));
  }

  function forgetToken() {
    store.remove(TOKEN_STORE);
    githubToken = null;
    tokenSaved = false;
    renderToken();
  }

  const contentsUrl = () => `https://api.github.com/repos/${meta.repository}/contents/${meta.path}`;
  async function github(url, token, init = {}) {
    const headers = { Accept: "application/vnd.github+json" };
    if (token) headers.Authorization = `Bearer ${token}`;
    if (init.body) headers["Content-Type"] = "application/json";
    const res = await fetch(url, { ...init, headers, cache: "no-store" });
    let json = null;
    try { json = await res.json(); } catch (err) { /* no JSON body */ }
    return { ok: res.ok, status: res.status, json, message: (json && json.message) || res.statusText || "" };
  }
  function problem(res) {
    const repo = meta.repository;
    if (res.status === 401) return "GitHub didn't accept the token: it may have expired or been revoked. Create a new one and paste it below.";
    if (res.status === 403) return `The token isn't allowed to change ${repo}: give it Contents: Read and write on this repository. (GitHub said: ${res.message})`;
    if (res.status === 404) return `GitHub couldn't find ${repo} with this token. Check that the token has access to this repository.`;
    return `GitHub said: ${res.status} ${res.message}`.trim();
  }

  async function save() {
    let doc;
    try {
      doc = collect();
    } catch (err) {
      say(err.message, "bad");
      return;
    }
    if (!meta.repository) { say("Saving only works on your hosted board.", "bad"); return; }
    const typed = tokenInput.value.trim();
    const token = typed || githubToken;
    if (!token) {
      say("To save, paste a GitHub token under Saving (the steps are right above it).", "bad");
      tokenInput.focus();
      return;
    }
    if (!window.CompressionStream) { say("This browser can't save settings. Use an up-to-date browser.", "bad"); return; }
    saveButton.disabled = true;
    saveButton.textContent = "Saving…";
    say("");
    const fail = (res) => {
      if (res.status === 401 && !typed) forgetToken();  // the saved token stopped working
      say(problem(res), "bad");
    };
    try {
      const sealed = await seal(doc, boardKey);
      const body = { message: "Update job board settings", content: btoa(JSON.stringify(sealed)) };
      if (overwrite) {  // you chose to replace settings that were changed elsewhere
        const res = await github(contentsUrl(), token);
        if (res.ok) knownSha = res.json.sha;
        else if (res.status === 404) knownSha = null;
        else { fail(res); return; }
      }
      if (knownSha) body.sha = knownSha;
      const res = await github(contentsUrl(), token, { method: "PUT", body: JSON.stringify(body) });
      // 409: the file isn't the version this page saw (unless a branch rule refused the change).
      const changed = (res.status === 409 && !/rule|protect|pull request/i.test(res.message)) || (res.status === 422 && /sha/i.test(res.message));
      if (changed) {
        overwrite = true;
        say("Your settings were changed somewhere else after this page was built: on another device, or by a save that's still being scanned. Reload in a few minutes to see them, or press Save and scan again to replace them with these.", "bad");
        return;
      }
      if (!res.ok) { fail(res); return; }
      overwrite = false;
      knownSha = res.json && res.json.content ? res.json.content.sha : null;
      current = doc;
      editor.base = clone(doc);
      savedAt = Date.now();
      store.set(PENDING_STORE, { savedAt, sha: knownSha, config: sealed });
      if (typed) {
        githubToken = typed;
        tokenSaved = rememberInput.checked;
        if (tokenSaved) store.set(TOKEN_STORE, await seal({ token: typed }, boardKey)); else store.remove(TOKEN_STORE);
        renderToken();
      }
      renderBanner();
      say("Saved. A scan with these settings has started, and your board updates when it finishes, usually within a few minutes. ", "good",
        actionsUrl() ? external(actionsUrl(), "Watch it on GitHub ↗") : "");
    } catch (err) {
      say(`Couldn't save: ${err.message || err}. Check your connection and try again.`, "bad");
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = "Save and scan";
    }
  }
})();
</script>
</body>
</html>
