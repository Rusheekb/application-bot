[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jobbot"
version = "0.1.0"
description = "Self-hosted job search assistant: monitors company career pages and job boards, scores each posting against your profile, and can fill applications for you with an AI agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# LinkedIn, Indeed, Glassdoor, ZipRecruiter and Google Jobs via the JobSpy scraper.
scrapers = ["python-jobspy>=1.4"]
# Browser automation for the auto-apply agent.
apply = ["playwright>=1.50"]
# Encryption for the hosted job board (`jobbot publish`, GitHub Pages).
pages = ["cryptography>=42"]
all = ["jobbot[scrapers,apply,pages]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
jobbot = "jobbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:jobspy.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "B008", "SIM108", "ASYNC240"]
