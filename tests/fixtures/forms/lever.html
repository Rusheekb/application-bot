<!doctype html>
<!-- Modeled on a Lever application page (jobs.lever.co/{company}/{id}/apply) for offline tests. -->
<html lang="en">
<head><meta charset="utf-8"><title>Acme - Data Engineer</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; }
  li { list-style: none; margin: 10px 0; }
  .application-answer-alternative { margin-left: 4px; }
  #resume-upload-input { opacity: 0; position: absolute; width: 1px; height: 1px; }
</style></head>
<body>
<div class="posting-headline"><h2>Data Engineer</h2></div>
<form id="application-form" method="POST" action="/fake-submit">
  <div class="section application-form">
    <h4>Submit your application</h4>
    <ul>
      <li class="application-question resume">
        <label>
          <div class="application-label">Resume/CV<span class="required">✱</span></div>
          <div class="application-field">
            <a class="visible-resume-upload">ATTACH RESUME/CV</a>
            <input type="file" id="resume-upload-input" name="resume">
          </div>
        </label>
      </li>
      <li class="application-question">
        <label><div class="application-label">Full name<span class="required">✱</span></div>
        <div class="application-field"><input type="text" name="name" required></div></label>
      </li>
      <li class="application-question">
        <label><div class="application-label">Email<span class="required">✱</span></div>
        <div class="application-field"><input type="email" name="email" required></div></label>
      </li>
      <li class="application-question">
        <label><div class="application-label">Phone</div>
        <div class="application-field"><input type="text" name="phone"></div></label>
      </li>
      <li class="application-question">
        <label><div class="application-label">Current company</div>
        <div class="application-field"><input type="text" name="org"></div></label>
      </li>
    </ul>
    <h4>Links</h4>
    <ul>
      <li class="application-question">
        <label><div class="application-label">LinkedIn URL</div>
        <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label>
      </li>
    </ul>
    <ul>
      <li class="application-question custom-question">
        <div class="application-label full-width">Are you authorized to work in the US without sponsorship?<span class="required">✱</span></div>
        <div class="application-field full-width">
          <ul>
            <li><label><input type="radio" name="cards[abc][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
            <li><label><input type="radio" name="cards[abc][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
          </ul>
        </div>
      </li>
      <li class="application-question custom-question">
        <div class="application-label full-width">Which of our offices could you work from?</div>
        <div class="application-field full-width">
          <ul>
            <li><label><input type="checkbox" name="cards[abc][field1]" value="New York"><span>New York</span></label></li>
            <li><label><input type="checkbox" name="cards[abc][field1]" value="San Francisco"><span>San Francisco</span></label></li>
            <li><label><input type="checkbox" name="cards[abc][field1]" value="Remote"><span>Remote</span></label></li>
          </ul>
        </div>
      </li>
      <li class="application-question custom-question">
        <div class="application-label full-width">Years of experience with Spark<span class="required">✱</span></div>
        <div class="application-field full-width"><input type="number" name="cards[abc][field2]" required></div>
      </li>
    </ul>
    <h4>Additional information</h4>
    <textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea>
    <h4>U.S. Equal Employment Opportunity information</h4>
    <div class="application-question">
      <label><div class="application-label">Gender</div>
      <select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></label>
    </div>
    <div class="application-question">
      <label><div class="application-label">Veteran status</div>
      <select name="eeo[veteran]"><option value="">Select ...</option><option value="I am a veteran">I am a veteran</option><option value="I am not a veteran">I am not a veteran</option><option value="Decline to self-identify">Decline to self-identify</option></select></label>
    </div>
  </div>
  <button type="submit" class="template-btn-submit postings-btn">Submit application</button>
</form>
<script>
  document.getElementById('application-form').addEventListener('submit', (e) => {
    e.preventDefault();
    window.submitted = (window.submitted || 0) + 1;
    document.body.innerHTML = '<h3>Application submitted!</h3><p>Thanks for applying to Acme.</p>';
  });
</script>
</body>
</html>
